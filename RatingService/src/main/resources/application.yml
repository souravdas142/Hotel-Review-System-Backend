server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: rating-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8085}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-db:5432/microservices}
    username: ${DB_USERNAME:sourav}
    password: ${DB_PASSWORD:sourav}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://service-registry:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always